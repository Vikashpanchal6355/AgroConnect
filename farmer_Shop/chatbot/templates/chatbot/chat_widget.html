{% load static %}
{% load i18n %}
<div id="chatWidget" class="chat-widget" style="
    position: fixed;
    right: 20px;
    bottom: 20px;
    z-index: 9999;
">
    <button id="chatWidgetBtn" type="button" onclick="window.toggleChatWidget()" aria-label="Open chat" style="
        width: 60px;
        height: 60px;
        border: none;
        border-radius: 50%;
        background: linear-gradient(135deg, #2e7d32 0%, #4caf50 100%);
        color: white;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(46, 125, 50, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
    ">
        <i class="fa-solid fa-comments" style="font-size: 24px;"></i>
    </button>

    <div id="chatPopup" style="
        display: none;
        position: absolute;
        right: 0;
        bottom: 74px;
        width: min(380px, calc(100vw - 32px));
        height: min(500px, calc(100vh - 120px));
        background: white;
        border-radius: 15px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        overflow: hidden;
        flex-direction: column;
    ">
        <div style="
            background: linear-gradient(135deg, #2e7d32 0%, #4caf50 100%);
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        ">
            <div style="display: flex; align-items: center; gap: 10px;">
                <div style="
                    width: 40px;
                    height: 40px;
                    background: rgba(255,255,255,0.2);
                    border-radius: 50%;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    font-size: 20px;
                ">AI</div>
                <div>
                    <h4 style="margin: 0; font-size: 16px;">AgroConnect Assistant</h4>
                    <small style="opacity: 0.9;">
                        <span style="display: inline-block; width: 8px; height: 8px; background: #b7ff9a; border-radius: 50%; margin-right: 5px;"></span>Online
                    </small>
                </div>
            </div>
            <button type="button" onclick="window.toggleChatWidget()" aria-label="Close chat" style="
                background: none;
                border: none;
                color: white;
                cursor: pointer;
                font-size: 20px;
            ">
                <i class="fa-solid fa-times"></i>
            </button>
        </div>

        <div id="chatMessagesWidget" style="
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background: #f5f7fa;
        ">
            <div style="
                text-align: center;
                padding: 20px;
                background: white;
                border-radius: 10px;
                margin-bottom: 15px;
            ">
                <div style="font-size: 34px; margin-bottom: 10px;">
                    <i class="fa-solid fa-seedling" style="color: #2e7d32;"></i>
                </div>
                <h4 style="color: #2e7d32; margin-bottom: 5px;">Namaste!</h4>
                <p style="color: #666; font-size: 13px; margin: 0;">How can I help you today?</p>
            </div>
        </div>

        <div id="quickRepliesWidget" style="
            padding: 10px 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            background: white;
            border-top: 1px solid #eee;
        ">
            <button class="quick-reply-btn" type="button" onclick="window.handleQuickReply('browse_shop', this)">Shop</button>
            <button class="quick-reply-btn" type="button" onclick="window.handleQuickReply('show_categories', this)">Categories</button>
            <button class="quick-reply-btn" type="button" onclick="window.handleQuickReply('track_order', this)">Track</button>
            <button class="quick-reply-btn" type="button" onclick="window.handleQuickReply('show_help', this)">Help</button>
        </div>

        <div style="
            padding: 15px;
            display: flex;
            gap: 10px;
            background: #fafafa;
            border-top: 1px solid #eee;
        ">
            <input
                type="text"
                id="chatInputWidget"
                placeholder="Type a message..."
                style="
                    flex: 1;
                    padding: 10px 15px;
                    border: 2px solid #e0e0e0;
                    border-radius: 25px;
                    font-size: 14px;
                    outline: none;
                "
                onkeypress="if(event.key==='Enter') window.sendChatMessage()"
            >
            <button type="button" onclick="window.sendChatMessage()" aria-label="Send message" style="
                width: 45px;
                height: 45px;
                background: linear-gradient(135deg, #2e7d32 0%, #4caf50 100%);
                border: none;
                border-radius: 50%;
                color: white;
                cursor: pointer;
            ">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>
    </div>
</div>

<style>
.quick-reply-btn {
    background: white;
    border: 1px solid #ddd;
    padding: 6px 12px;
    border-radius: 15px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.3s;
}
.quick-reply-btn:hover {
    background: #2e7d32;
    color: white;
    border-color: #2e7d32;
}
.chat-message {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 15px;
    margin-bottom: 10px;
    font-size: 14px;
    line-height: 1.4;
}
.chat-message.bot {
    background: white;
    color: #333;
    margin-right: auto;
    border-bottom-left-radius: 5px;
}
.chat-message.user {
    background: linear-gradient(135deg, #2e7d32 0%, #4caf50 100%);
    color: white;
    margin-left: auto;
    border-bottom-right-radius: 5px;
}
.chat-message .time {
    font-size: 10px;
    opacity: 0.7;
    margin-top: 5px;
    text-align: right;
}
.product-item-chat {
    background: white;
    border: 1px solid #eee;
    border-radius: 10px;
    padding: 10px;
    margin: 8px 0;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    transition: all 0.3s;
}
.product-item-chat:hover {
    border-color: #4caf50;
}
.product-item-chat img {
    width: 50px;
    height: 50px;
    object-fit: cover;
    border-radius: 8px;
}
.typing-dots {
    display: flex;
    gap: 4px;
    padding: 12px 15px;
    background: white;
    border-radius: 15px;
    width: fit-content;
    margin-bottom: 10px;
}
.typing-dots span {
    width: 8px;
    height: 8px;
    background: #999;
    border-radius: 50%;
    animation: typingBounce 1.4s infinite;
}
.typing-dots span:nth-child(2) { animation-delay: 0.2s; }
.typing-dots span:nth-child(3) { animation-delay: 0.4s; }
@media (max-width: 575px) {
    #chatWidget {
        right: 12px !important;
        bottom: 12px !important;
    }
}
@keyframes typingBounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-6px); }
}
</style>

<script>
(function() {
    var chatSessionId = "chat_" + Date.now() + "_" + Math.random().toString(36).slice(2, 11);
    var chatOpen = false;

    window.toggleChatWidget = function() {
        chatOpen = !chatOpen;
        var popup = document.getElementById("chatPopup");
        var btn = document.getElementById("chatWidgetBtn");

        if (!popup || !btn) {
            return;
        }

        if (chatOpen) {
            popup.style.display = "flex";
            btn.innerHTML = '<i class="fa-solid fa-times" style="font-size: 24px;"></i>';
            var inputField = document.getElementById("chatInputWidget");
            if (inputField) {
                inputField.focus();
            }
        } else {
            popup.style.display = "none";
            btn.innerHTML = '<i class="fa-solid fa-comments" style="font-size: 24px;"></i>';
        }
    };

    window.addChatMessage = function(text, type) {
        var container = document.getElementById("chatMessagesWidget");
        if (!container) {
            return;
        }

        var msgDiv = document.createElement("div");
        msgDiv.className = "chat-message " + type;
        var time = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        msgDiv.innerHTML = String(text).replace(/\n/g, "<br>") + '<div class="time">' + time + "</div>";
        container.appendChild(msgDiv);
        container.scrollTop = container.scrollHeight;
    };

    window.showTypingDots = function() {
        var container = document.getElementById("chatMessagesWidget");
        if (!container || document.getElementById("typingDots")) {
            return;
        }

        var dots = document.createElement("div");
        dots.className = "typing-dots";
        dots.id = "typingDots";
        dots.innerHTML = "<span></span><span></span><span></span>";
        container.appendChild(dots);
        container.scrollTop = container.scrollHeight;
    };

    window.hideTypingDots = function() {
        var dots = document.getElementById("typingDots");
        if (dots) {
            dots.remove();
        }
    };

    window.getCSRFToken = function() {
        var cookieValue = null;
        var cookies = document.cookie.split(";");
        for (var i = 0; i < cookies.length; i++) {
            var cookie = cookies[i].trim();
            if (cookie.substring(0, "csrftoken".length + 1) === "csrftoken=") {
                cookieValue = decodeURIComponent(cookie.substring("csrftoken".length + 1));
                break;
            }
        }
        return cookieValue;
    };

    window.sendChatMessage = function() {
        var input = document.getElementById("chatInputWidget");
        if (!input) {
            return;
        }

        var message = input.value.trim();
        if (!message) {
            return;
        }

        window.addChatMessage(message, "user");
        input.value = "";
        window.showTypingDots();

        fetch('{% url "chatbot_api" %}', {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": window.getCSRFToken()
            },
            body: JSON.stringify({
                message: message,
                session_id: chatSessionId
            })
        })
            .then(function(response) { return response.json(); })
            .then(function(data) {
                window.hideTypingDots();
                if (!data.success) {
                    window.addChatMessage("Sorry, something went wrong. Please try again.", "bot");
                    return;
                }

                window.addChatMessage(data.response, "bot");
                if (data.products && data.products.length > 0) {
                    var container = document.getElementById("chatMessagesWidget");
                    if (!container) {
                        return;
                    }

                    data.products.forEach(function(product) {
                        var prodDiv = document.createElement("div");
                        prodDiv.className = "product-item-chat";
                        prodDiv.innerHTML =
                            '<img src="' + (product.image || "{% static 'images/logo/image.png' %}") + '" alt="' + product.name + '">' +
                            "<div><strong>" + product.name + "</strong><br><span style=\"color: #2e7d32; font-weight: bold;\">₹" + product.price + "</span></div>";
                        container.appendChild(prodDiv);
                    });
                    container.scrollTop = container.scrollHeight;
                }
            })
            .catch(function() {
                window.hideTypingDots();
                window.addChatMessage("Sorry, I encountered an error. Please try again.", "bot");
            });
    };

    window.handleQuickReply = function(action, btn) {
        var label = btn ? (btn.textContent || "").trim() : "";
        if (label) {
            window.addChatMessage(label, "user");
        }
        window.showTypingDots();

        fetch('{% url "chatbot_quick_reply" %}', {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": window.getCSRFToken()
            },
            body: JSON.stringify({
                action: action,
                session_id: chatSessionId
            })
        })
            .then(function(response) { return response.json(); })
            .then(function(data) {
                window.hideTypingDots();
                if (data.success) {
                    window.addChatMessage(data.response, "bot");
                } else {
                    window.addChatMessage("Sorry, something went wrong. Please try again.", "bot");
                }
            })
            .catch(function() {
                window.hideTypingDots();
                window.addChatMessage("Sorry, I encountered an error. Please try again.", "bot");
            });
    };
})();
</script>
