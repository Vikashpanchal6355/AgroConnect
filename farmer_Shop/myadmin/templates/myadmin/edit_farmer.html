{% extends 'myadmin/base.html' %}
{% block page_title %}Edit Farmer{% endblock %}
{% block page_header %}Edit Farmer{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="card">
      <div class="card-header">
        <h6 class="mb-0">{{ farmer.name }}</h6>
      </div>
      <div class="card-body">
        <form method="POST">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" name="name" value="{{ farmer.name }}" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Phone</label>
            <input type="text" name="phone" value="{{ farmer.phone }}" class="form-control" required>
          </div>
          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" name="is_active" id="is_active" {% if farmer.is_active %}checked{% endif %}>
            <label class="form-check-label" for="is_active">
              Active
            </label>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-success">
              <i class="fas fa-save"></i> Update Farmer
            </button>
            <a href="/myadmin/" class="btn btn-secondary">
              Cancel
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
